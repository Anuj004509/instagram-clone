<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <h1>Instagram</h1>

        <ul>
            <li>Home</li>
            <li>Search</li>
            <li>Explore</li>
            <li>Reels</li>
            <li>Messages</li>
            <li>Notifications</li>
            <li>Create</li>
            <li>Profile</li>
        </ul>
    </nav>


    <!-- Main Content -->
    <main>

        <!-- Stories Section -->
        <section class="stories">

            <div class="story">
                <img src="https://via.placeholder.com/60" alt="Story">
                <p>Your Story</p>
            </div>

            <div class="story">
                <img src="https://via.placeholder.com/60" alt="Story">
                <p>user1</p>
            </div>

            <div class="story">
                <img src="https://via.placeholder.com/60" alt="Story">
                <p>user2</p>
            </div>

            <div class="story">
                <img src="https://via.placeholder.com/60" alt="Story">
                <p>user3</p>
            </div>

        </section>


        <!-- Post Section -->
        <section class="post">

            <div class="post-header">
                <img src="https://via.placeholder.com/40" alt="Profile">
                <h3>username</h3>
            </div>

            <img 
                class="post-image"
                src="https://via.placeholder.com/500"
                alt="Instagram Post"
            >

            <div class="post-actions">
                <button>❤️</button>
                <button>💬</button>
                <button>📤</button>
            </div>

            <p><strong>username</strong> This is my first post!</p>

            <p>View all comments</p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
