<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <h1>Instagram</h1>

        <ul>
            <li>Home</li>
            <li>Search</li>
            <li>Explore</li>
            <li>Reels</li>
            <li>Messages</li>
            <li>Notifications</li>
            <li>Create</li>
            <li>Profile</li>
        </ul>
    </nav>


    <!-- Main Content -->
    <main>

     <main>

    <!-- Stories -->
    <section class="stories">

        <div class="story">
            <img src="https://i.pravatar.cc/60?img=1" alt="Your Story">
            <p>Your Story</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/60?img=2" alt="user1">
            <p>user1</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/60?img=3" alt="user2">
            <p>user2</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/60?img=4" alt="user3">
            <p>user3</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/60?img=5" alt="user4">
            <p>user4</p>
        </div>

    </section>


    <!-- First Post -->
    <section class="post">

        <div class="post-header">
            <img src="https://i.pravatar.cc/40?img=10" alt="Profile">
            <h3>john_doe</h3>
            <button class="follow-btn">Follow</button>
        </div>
        <img
            class="post-image"
            src="https://picsum.photos/600/500?random=1"
            alt="Instagram Post"
        >

        <div class="post-actions">
            <button>❤️</button>
            <button>💬</button>
            <button>📤</button>
        </div>

        <p><strong>john_doe</strong> Enjoying the day! 📸</p>

        <p>View all comments</p>
        <div class="comment-box">
            <input type="text" placeholder="Add a comment...">
            <button>Post</button>
        </div>

    </section>


    <!-- Second Post -->
    <section class="post">

        <div class="post-header">
            <img src="https://i.pravatar.cc/40?img=20" alt="Profile">
            <h3>travel_world</h3>
            <button class="follow-btn">Follow</button>
        </div>

        <img
            class="post-image"
            src="https://picsum.photos/600/500?random=2"
            alt="Travel Post"
        >

        <div class="post-actions">
            <button>❤️</button>
            <button>💬</button>
            <button>📤</button>
        </div>

        <p><strong>travel_world</strong> Beautiful place! 🌍</p>

        <p>View all comments</p>
        <div class="comment-box">
            <input type="text" placeholder="Add a comment...">
            <button>Post</button>
        </div>

    </section>

</main>

    </main>

    <script src="script.js"></script>

</body>
</html>
